spring:
  application:
    name: recommendation-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/recommendation_db  # tu BD
    username: postgres      # tú lusuario de bd
    password: 12345 #postgres123   # tú contraseña de bd
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update      # en prod: none
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always


  springdoc:
    api-docs:
      enabled: true
      path: /v3/api-docs      # default
    swagger-ui:
      enabled: true
      path: /swagger-ui.html  # accesible como http://localhost:8080/swagger-ui.html

  server:
    port: 8080
